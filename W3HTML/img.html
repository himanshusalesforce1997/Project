<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image</title>
  </head>
  <body>
    <img
      src="../W3HTML/Media/Bulboff.jpg"
      alt="bulb"
      width="100px"
      height="100px"
      style="float: right"
    />

    <img
      src="../W3HTML/Media/Bulbon.jpg"
      alt="bulb"
      width="100px"
      height="100px"
      style="float: left"
    />
    <!-- Image map -->
    <img
      src="../W3HTML/Media/Bulboff.jpg"
      alt="bulb"
      width="100px"
      height="100px"
      usemap="#workmap"
    />

    <map name="#workmap">
      <area shape="rect" coords="" href="" alt="" onclick="" />
      <area shape="circle" coords="" href="" alt="" onclick="" />
      <area shape="poly" coords="" href="" alt="" onclick="" />
      <area shape="default" coords="" href="" alt="" onclick="" />
    </map>
    <!-- Image map -->
  </body>
</html>
