<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      table,
      tr,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <table style="width: 100%">
      <tr>
        <th style="width: 70%; text-align: left">heloo</th>
        <th>heloo</th>
        <th>heloo</th>
      </tr>
      <tr style="height: 200px">
        <td>daily</td>
        <td>daily</td>
        <td>daily</td>
      </tr>
      <tr>
        <td>bring</td>
        <td>bring</td>
        <td>bring</td>
      </tr>
    </table>
    <br />
    <table>
      <caption>
        table
      </caption>
      <tr>
        <td>hello</td>
        <td>hello</td>
        <td colspan="2">hello</td>
      </tr>
      <tr>
        <td>hello</td>
        <td>hello</td>
        <td>hello</td>
        <td>hello</td>
      </tr>
      <tr>
        <td rowspan="2">hello</td>
        <td>hello</td>
        <td>hello</td>
        <td>hello</td>
      </tr>
      <tr>
        <td>hello</td>
        <td>hello</td>
        <td>hello</td>
      </tr>
    </table>
  </body>
</html>
